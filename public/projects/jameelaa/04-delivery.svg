<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 720" role="img" aria-label="Delivery pipeline illustration from commit through observability"><defs><pattern id="grid" width="38" height="38" patternUnits="userSpaceOnUse"><path d="M38 0H0V38" fill="none" stroke="#24372a" opacity=".09"/></pattern><radialGradient id="shine"><stop stop-color="#e1e9ca"/><stop offset="1" stop-color="#c5d4a6"/></radialGradient></defs><rect x="0" y="0" width="1200" height="720" rx="0" fill="#cbea5b" stroke="none" stroke-width="1"/><text x="71" y="79" fill="#243027" font-size="16" font-family="Arial, sans-serif" font-weight="700" text-anchor="start" >04 / FROM FIRST COMMIT TO PRODUCTION</text><text x="70" y="177" fill="#243027" font-size="62" font-family="Arial, sans-serif" font-weight="750" text-anchor="start" >Shipping is part of the system.</text><text x="72" y="220" fill="#243027" font-size="22" font-family="Arial, sans-serif" font-weight="400" text-anchor="start" >Release quality does not end when the code builds.</text><rect x="72" y="306" width="1056" height="232" rx="24" fill="#222b24" stroke="none" stroke-width="1"/><rect x="107" y="349" width="222" height="149" rx="12" fill="#343f35" stroke="none" stroke-width="1"/><text x="123" y="408" fill="#f0f4e8" font-size="20" font-family="Arial, sans-serif" font-weight="750" text-anchor="start" >01  COMMIT</text><text x="123" y="449" fill="#c1cfc0" font-size="13" font-family="Arial, sans-serif" font-weight="400" text-anchor="start" >Code review</text><rect x="367" y="349" width="222" height="149" rx="12" fill="#343f35" stroke="none" stroke-width="1"/><text x="383" y="408" fill="#f0f4e8" font-size="20" font-family="Arial, sans-serif" font-weight="750" text-anchor="start" >02  TEST</text><text x="383" y="449" fill="#c1cfc0" font-size="13" font-family="Arial, sans-serif" font-weight="400" text-anchor="start" >Automated checks</text><rect x="627" y="349" width="222" height="149" rx="12" fill="#e6efd2" stroke="none" stroke-width="1"/><text x="643" y="408" fill="#1a2519" font-size="20" font-family="Arial, sans-serif" font-weight="750" text-anchor="start" >03  DEPLOY</text><text x="643" y="449" fill="#4e6e47" font-size="13" font-family="Arial, sans-serif" font-weight="400" text-anchor="start" >Controlled rollout</text><rect x="887" y="349" width="222" height="149" rx="12" fill="#343f35" stroke="none" stroke-width="1"/><text x="903" y="408" fill="#f0f4e8" font-size="20" font-family="Arial, sans-serif" font-weight="750" text-anchor="start" >04  OBSERVE</text><text x="903" y="449" fill="#c1cfc0" font-size="13" font-family="Arial, sans-serif" font-weight="400" text-anchor="start" >Monitor &amp; improve</text><text x="73" y="624" fill="#243027" font-size="19" font-family="Arial, sans-serif" font-weight="600" text-anchor="start" >Production ownership includes rollback, security and incident readiness.</text><text x="1104" y="675" fill="#243027" font-size="12" font-family="Arial, sans-serif" font-weight="700" text-anchor="end" >SIMPLIFIED PROCESS, NOT INTERNAL DEPLOYMENT DETAILS</text></svg>